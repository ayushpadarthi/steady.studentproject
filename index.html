<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Steady</title>
<style>
  :root { --ink: #1b1b1f; --muted: #5f6066; --line: #d9d9de; --steady: #1f6b4e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 28px; font-weight: 650; letter-spacing: -.015em; margin: 0 0 8px; }
  p { margin: 0 0 28px; color: var(--muted); }
  a.go { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; min-height: 64px; padding: 18px 20px;
    border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; margin-bottom: 12px; }
  a.go:hover { border-color: var(--ink); }
  a.go.primary { background: var(--steady); border-color: var(--steady); color: #fff; }
  a.go b { font-weight: 600; }
  a.go span { font-size: 14px; opacity: .8; }
  a.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Steady</h1>
  <p>A drawing tool that removes hand tremor from your lines as you draw, without making them lag.</p>

</main>
</body>
</html>
